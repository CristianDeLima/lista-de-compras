<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quicklist</title>
  <link rel="stylesheet" href="styles/index.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <img class="logo" src="assets/logo.svg" alt="Logo">
  </header>

  <main>
    <section>
      <nav>
        <img src="assets/icons/back.svg" alt="">
        <h1>Compras da semana</h1>
      </nav>
      <div class="input">
        <input type="text" name="" id="" placeholder="Adicione um novo item">
        <button class="button">Adicionar item</button>
      </div>

      <div class="items">

        <div class="item display-none">
          <input type="checkbox" name="" id="">
          <p>Pão de forma</p>
          <button class="delete">
            <img src="assets/icons/delete.svg" alt="">
          </button>
        </div>    

      </div>

      <div class="removed display-none">
        <img src="assets/icons/warning.svg" alt="">
        <p>O item foi removido da lista</p>
        <button class="delete">
          <img src="assets/icons/delete-small.svg" alt="">
        </button>
      </div>
    </section>
  </main>
</body>
</html>
